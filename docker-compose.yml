services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ramkrishna_sales
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  app:
    build: .
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ramkrishna_sales
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: change-this-development-secret-to-a-random-value
      DOCUMENT_STORAGE_PATH: /app/data/documents
      LOG_DIR: /app/logs
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    volumes:
      - document_data:/app/data/documents
      - log_data:/app/logs
volumes:
  postgres_data:
  document_data:
  log_data:
