spring:
  application:
    name: ramkrishna-sales-service
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ramkrishna_sales}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-this-secret-to-a-random-32-plus-character-value}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  storage:
    documents: ${DOCUMENT_STORAGE_PATH:./data/documents}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
